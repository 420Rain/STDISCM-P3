# Read by LoadFile.java. Keep p, c and q aligned with consumer/config.properties.
p=3
c=2
q=4

# Consumer's reachable IP or DNS name. Use "consumer" for the included Docker Compose network.
consumer.host=127.0.0.1
grpc.port=50051
http.port=8080

# Producer 1 reads videos/producer-1, Producer 2 reads videos/producer-2, etc.
producer.input.dir=videos
storage.dir=data
ffmpeg.path=ffmpeg
chunk.size.bytes=65536
max.video.mb=500
max.retries=5
retry.delay.ms=1000
