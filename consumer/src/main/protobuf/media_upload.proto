syntax = "proto3";

package mediaupload;

option java_multiple_files = true;
option java_package = "com.example.mediaupload.grpc";
option java_outer_classname = "MediaUploadProtocol";

// The producer first asks for a queue slot. Only after ACCEPTED does it stream bytes.
service MediaUploadService {
  rpc BeginUpload(BeginUploadRequest) returns (BeginUploadReply);
  rpc UploadVideo(stream VideoChunk) returns (UploadReply);
  rpc CancelUpload(CancelUploadRequest) returns (ActionReply);
}

enum UploadStatus {
  UPLOAD_STATUS_UNSPECIFIED = 0;
  ACCEPTED = 1;
  QUEUE_FULL = 2;
  DUPLICATE_CONTENT = 3;
  DUPLICATE_IN_PROGRESS = 4;
  ALREADY_RECEIVING = 5;
  ALREADY_QUEUED = 6;
  ALREADY_PROCESSING = 7;
  ALREADY_SAVED = 8;
  IDEMPOTENCY_CONFLICT = 9;
  INVALID_REQUEST = 10;
  CANCELLED = 11;
  FAILED = 12;
  QUEUED = 13;
  STORED = 14;
  PROCESSING = 15;
  RECEIVING = 16;
}

message BeginUploadRequest {
  string upload_id = 1;
  string original_filename = 2;
  string sha1 = 3;
  int64 file_size = 4;
}

message BeginUploadReply {
  UploadStatus status = 1;
  string message = 2;
  string video_id = 3;
  string related_upload_id = 4;
  string stream_token = 5;
}

message VideoChunk {
  string upload_id = 1;
  int32 chunk_index = 2;
  bytes data = 3;
  string stream_token = 4;
}

message UploadReply {
  UploadStatus status = 1;
  string message = 2;
  string video_id = 3;
}

message CancelUploadRequest {
  string upload_id = 1;
}

message ActionReply {
  bool success = 1;
  string message = 2;
}
